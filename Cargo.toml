[package]
name = "nyvexa"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
default-run = "nyvexa"
description = "A Discord bot powered by Gloam Commands"
license = "MIT"
repository = "https://github.com/aliceblackrose/nyvexa"

[dependencies]
gloam-commands = { git = "https://github.com/aliceblackrose/gloam-macro-commands", rev = "5122e534b5195c7d8145b72f740d9f6e5dd13475" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
